<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
</head>
<style>
    /* Footer */

.footer{
    background:#1a14cc;
    color:#fff;
    padding:60px 8% 20px;
}

.footer-content{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:40px;
}

.footer-logo h2{
    margin-bottom:15px;
    font-size:28px;
}

.footer-logo p{
    color:#cbd5e1;
    line-height:1.7;
}

.footer-links h3,
.footer-social h3{
    margin-bottom:20px;
}

.footer-links a{
    display:block;
    color:#cbd5e1;
    text-decoration:none;
    margin-bottom:12px;
    transition:.3s;
}

.footer-links a:hover{
    color:#2563eb;
    padding-left:8px;
}

.footer-social a{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    width:42px;
    height:42px;
    margin-right:10px;
    border-radius:50%;
    background:#1f2937;
    color:#fff;
    text-decoration:none;
    transition:.3s;
    font-size:18px;
}

.footer-social a:hover{
    background:#2563eb;
    transform:translateY(-4px);
}

.footer-bottom{
    text-align:center;
    border-top:1px solid #eceff3;
    margin-top:40px;
    padding-top:20px;
    color:#9ca3af;
}
</style>
<body>
    <footer class="footer">

    <div class="footer-content">

        <div class="footer-logo">
            <h2>MyPortfolio</h2>
            <p>Creating modern, responsive, and user-friendly websites with clean code and elegant design.</p>
        </div>

        <div class="footer-links">
            <h3>Quick Links</h3>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Portfolio</a>
            <a href="#">Contact</a>
        </div>

        <div class="footer-social">
            <h3>Follow Me</h3>
          <a href="https://facebook.com" target="_blank">
    <i class="fa-brands fa-facebook-f"></i>
</a>

<a href="https://instagram.com" target="_blank">
    <i class="fa-brands fa-instagram"></i>
</a>

<a href="https://linkedin.com" target="_blank">
    <i class="fa-brands fa-linkedin-in"></i>
</a>

<a href="https://github.com" target="_blank">
    <i class="fa-brands fa-github"></i>
</a>
   

    </div>

    <div class="footer-bottom">
        <p>© 2026 MyPortfolio | All Rights Reserved.</p>
    </div>

</footer>
    
</body>
</html>
